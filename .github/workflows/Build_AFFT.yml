name: Build AFFT Magisk Module

on:
  workflow_dispatch:
   inputs:
      tag_name:
        description: 'Tag name to build (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build AFFT Magisk Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Create AFFT Zip
        run: |
          zip -r AFFT-${{ github.event.inputs.tag_name }}.zip . -x ".git*" -x ".github*" -x "AFFT_Banner.jpg" -x "README.md"
    
      - name: Create a tag
        run: |
          git tag ${{ github.run_id }}
          git push origin ${{ github.run_id }}

      - name: Upload AFFT to Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            AFFT-${{ github.event.inputs.tag_name }}.zip
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: AFFT
          body: |
            AFFT ${{ github.event.inputs.tag_name }}
